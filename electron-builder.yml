appId: com.synech.app
productName: Synech
directories:
  output: release
files:
  - package.json
  - from: dist
    to: dist
    filter:
      - "**/*"
      - "!**/*.test.js"
      - "!**/*.test.d.ts"
      - "!**/*.test.js.map"
      - "!**/*.test.ts"
      - "!**/*.map"
extraMetadata:
  main: dist/app/panel-desktop.js
  productName: Synech
# Updates are served from GitHub Releases via electron-updater. The release
# workflow enforces that the tag matches package.json version, and attaches
# latest.yml plus the Setup exe the updater feed expects.
publish:
  provider: github
  owner: Gust-feng
  repo: Synech
asar: true
compression: normal
win:
  icon: build/icons/favicon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"
nsis:
  installerIcon: build/icons/favicon.ico
  uninstallerIcon: build/icons/favicon.ico
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  runAfterFinish: false
  include: packaging/windows/installer.nsh
  uninstallDisplayName: Synech
  # Keep legacy Electron app-data cleanup enabled. The custom uninstall macro
  # removes the canonical Synech Product Home as well.
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Synech
